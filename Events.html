<body>
    <div class="buttons-container">
         <button onclick="window.location.href = 'index.html'">Назад</button>

    <h1>Задания</h1>
    <table id="events-table">
        <thead>
            <tr>
                <th>Дата (день/месяц/год)</th>
                <th>Животное</th>
                <th>Событие</th>
            </tr>
        </thead>
        <tbody>
            <!-- Данные будут загружены сюда -->
        </tbody>
    </table>

    <script>
        async function loadCSV(url) {
            try {
                const response = await fetch(url);
                const data = await response.text();
                // Разделяем строки и обрабатываем каждую
                return data.split('\\n').map(row => {
                    // Убираем лишние пробелы и разбиваем по точкам с запятой
                    return row.trim().split(';').map(cell => cell.trim());
                });
            } catch (error) {
                console.error('Ошибка загрузки файла:', error);
                alert('Не удалось загрузить данные');
                return [];
            }
        }

        async function renderTable() {
            const csvUrl = 'https://disk.yandex.ru/i/Te_F8TrGb3hqXA'; // замените на реальную ссылку
            
            const data = await loadCSV(csvUrl);
            const tableBody = document.querySelector('#events-table tbody');
            
            // Очищаем таблицу перед заполнением
            tableBody.innerHTML = '';
            
            // Пропускаем первую строку, если это заголовки
            for (let i = 1; i < data.length; i++) {
                const row = data[i];
                
                // Проверяем, что строка не пустая и содержит минимум 3 поля
                if (!row || row.length < 3) continue;
                
                try {
                    // Проверяем корректность данных
                    if (!row[0] || !row[1] || !row[2]) {
                        continue; // пропускаем неполные строки
                    }
                    
                    // Форматируем дату
                    const date = new Date(row[0]);
                    if (isNaN(date)) {
                        throw new Error('Некорректная дата');
                    }
                    const formattedDate = [
                        date.getDate().toString().padStart(2, '0'),
                        (date.getMonth() + 1).toString().padStart(2, '0'),
                        date.getFullYear()
                    ].join('/');
                    
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${formattedDate}</td>
                        <td>${row[1] || '—'}</td>
                        <td>${row[2] || '—'}</td>
                    `;
                    tableBody.appendChild(tr);
                } catch (error) {
                    console.error('Ошибка обработки строки:', error, row);
                }
            }
        }

        // Загружаем данные при готовности документа

*/
