<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Зоренька — MAX MiniApp</title>
    <style>
        button {
        padding: 14px 16px;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 500;
        cursor: pointer;
        color: #1a1a1a;
        background-color: skyblue; /* небесноголубой */
        transition: background-color 0.2s, transform 0.1s;
      } 
      .buttons-container {
        display: flex;
        flex-direction: column;       /* КНОПКИ В СТОЛБИК */
        gap: 12px;                    /* Расстояние между кнопками */
        max-width: 320px;             /* Чтобы не растягивалось на весь экран */
        margin: 0 auto;               /* По центру страницы */
      }
    </style>





    </head>
  
    <body>

        <h1>Зоренька.</h1>
        <h1 id="user-id-name"></h1>    
        <script src="https://st.max.ru/js/max-web-app.js"></script>
        <script>
            //работа с МАХ
            if (window.WebApp) {
            window.WebApp.ready();
            const initDataUnsafe = window.WebApp.initDataUnsafe;
            const user = initDataUnsafe?.user;
            if (user) {
                const UserName = user.first_name; 
                const UserID=user.id;
                document.getElementById('user-id-name').textContent = `Здравствуйте, ${UserName}`;}
            else {
            document.getElementById('user-id-name').textContent='Данные пользователя недоступны — возможно, приложение запущено не в MAX';
            }
        } else {
            document.getElementById('user-id-name').textContent='Данные пользователя недоступны — возможно, приложение запущено не в MAX';
        }
        </script>
        <div class="buttons-container">
         <button onclick="window.location.href = 'Events.html'">Просмотр событий</button>
         <button onclick="handleAction('zadaniya')">Задания</button>
         <button onclick="handleAction('reports')">Отчеты</button>
        <button onclick="openFile('about')">О программе</button>
      </div>

      <script>
        const files = {
        'about': 'https://disk.yandex.ru/i/vZnEmDqQd2bECw',
        'МЕНЮ': 'https://disk.yandex.ru/i/ei_iPdH4ZJ502Q'
            };
         function handleAction(action) {


         }
        
         function openFile(key) {
            const url = files[key];
            if (!url || url.includes('ВАША_ССЫЛКА')) {
              alert('Ссылка на файл не настроена. Замените её в коде.');
              return;
            }
            // MAX Bridge: открываем ссылку внутри среды MAX
            if (window.max && window.max.openUrl) {
              window.max.openUrl(url);
            } else {
              // Фоллбэк: если MAX Bridge не инициализирован — открываем в новой вкладке
              window.open(url, '_blank');
            }
      }


      </script>




    </body>
</html>
