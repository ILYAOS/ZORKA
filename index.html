<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Зоренька</title>
    <!-- Подключаем MAX Bridge -->
    <script src="https://st.max.ru/js/max-web-app.js"></script>
    <style>
      body { font-family: Arial, sans-serif; padding: 20px; }
      .buttons-container { display: flex; gap: 12px; flex-direction: column; }
      button {
        padding: 14px 20px;
        font-size: 16px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        background-color: #007bff;
        color: white;
      }
      button:hover { background-color: #0056b3; }
      #output { margin-top: 20px; min-height: 60px; color: #333; }
    </style>
  </head>
  <body>
    <h2>Меню бота «Зоренька»</h2>
    <div id="user-info" style="margin-bottom: 15px; color: #555;"></div>
    <div class="buttons-container">
      <button onclick="handleAction('view_events')">Просмотр запланированных событий</button>
      <button onclick="handleAction('reports')">Отчёты</button>
      <button onclick="handleAction('capabilities')">Что умею</button>
    </div>
    <div id="output"></div>

    <script>
      // Ссылка на файл events.csv (должна быть прямой ссылкой на скачивание)
      const EVENTS_CSV_URL = 'https://disk.yandex.ru/i/C2k95NK2ThfsAg'; // ⚠️ Замени на прямую ссылку на скачивание или свой хостинг

      // Ссылка для кнопки «Что умею»
      const CAPABILITIES_LINK = 'https://disk.yandex.ru/i/vZnEmDqQd2bECw';

      // Инициализация MAX Bridge
      document.addEventListener('DOMContentLoaded', () => {
        if (window.MaxApp) {
          MaxApp.init().then(app => {
            const userId = app.userId;
            const userName = app.userName || 'Пользователь';
            document.getElementById('user-info').textContent =
              `Пользователь: ${userName} (ID: ${userId})`;
          }).catch(err => {
            console.error('MAX init error:', err);
            document.getElementById('user-info').textContent = 'Не удалось получить данные пользователя (работает вне MAX?)';
          });
        } else {
          document.getElementById('user-info').textContent = 'MAX Bridge не загружен (тестирование вне MAX)';
        }
      });

      function handleAction(action) {
        const output = document.getElementById('output');
        output.innerHTML = '';

        if (action === 'view_events') {
          // Открываем файл для скачивания
          downloadFile(EVENTS_CSV_URL, 'events.csv');
          output.textContent = 'Начинается загрузка файла events.csv…';
        } else if (action === 'reports') {
          output.textContent = 'Формирую отчёты… (в разработке)';
        } else if (action === 'capabilities') {
          window.open(CAPABILITIES_LINK, '_blank');
          output.textContent = 'Открываю описание возможностей…';
        }
      }

      function downloadFile(url, filename) {
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }
    </script>
  </body>
</html>
