<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>MAX: данные пользователя</title>
    <script src="https://st.max.ru/js/max-web-app.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
        background-color: #f5f5f5;
      }
      .container {
        max-width: 400px;
        margin: 0 auto;
        background: #ffffff;
        padding: 24px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      }
      h2 { margin-top: 0; color: #333; }
      #user-info {
        padding: 12px;
        background: #eef2f7;
        border: 1px solid #d9e2ec;
        border-radius: 6px;
        color: #2c3e50;
        min-height: 24px;
        margin-top: 16px;
        white-space: pre-wrap; /* чтобы переносы строк отображались */
      }
      button {
        padding: 12px 20px;
        font-size: 14px;
        cursor: pointer;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 6px;
      }
      button:hover { background-color: #0056b3; }
      .loading { color: #7f8c8d; }
      .error { color: #c0392b; }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Данные пользователя</h2>
      <button id="get-user-btn">О пользователе</button>
      <div id="user-info" class="loading">Нажмите кнопку, чтобы получить данные</div>
      <p style="margin-top:12px; font-size:12px; color:#888;">
        Проверьте консоль браузера (F12) — туда выводятся технические ошибки.
      </p>
    </div>

    <script>
      const bridge = new MaxBridge();
      const infoBox = document.getElementById('user-info');

      document.getElementById('get-user-btn').addEventListener('click', () => {
        infoBox.textContent = 'Загрузка данных…';
        infoBox.className = 'loading';

        // Сначала ждём готовности моста
        bridge.ready()
          .then(() => {
            console.log('MAX Bridge готов');
            return bridge.getUserInfo();
          })
          .then((userInfo) => {
            console.log('Получены данные:', userInfo);
            if (!userInfo) {
              infoBox.textContent = 'Данные пользователя не получены (null).';
              infoBox.className = 'error';
              return;
            }

            let text = '';
            if (userInfo.name) {
              text += `Имя: ${userInfo.name}\n`;
            } else {
              text += 'Имя: не указано\n';
            }
            if (userInfo.id) {
              text += `ID: ${userInfo.id}`;
            } else {
              text += 'ID: не указан';
            }
            infoBox.textContent = text;
            infoBox.className = '';
          })
          .catch((err) => {
            console.error('Ошибка получения данных:', err);
            infoBox.textContent = `Ошибка: ${err.message || String(err)}`;
            infoBox.className = 'error';
          });
      });
    </script>
  </body>
</html>
