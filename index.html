<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Мини‑приложение MAX: имя пользователя</title>
    <script src="https://st.max.ru/js/max-web-app.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
        background-color: #f5f5f5;
      }
      .container {
        max-width: 400px;
        margin: 0 auto;
        background: #ffffff;
        padding: 24px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      }
      h2 {
        margin-top: 0;
        color: #333;
      }
      #user-info {
        padding: 12px;
        background: #eef2f7;
        border: 1px solid #d9e2ec;
        border-radius: 6px;
        color: #2c3e50;
        min-height: 24px;
      }
      .loading { color: #7f8c8d; }
      .error { color: #c0392b; }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Пользователь</h2>
      <div id="user-info" class="loading">Загрузка данных пользователя…</div>
    </div>

    <script>
      // Инициализация MAX Bridge
      const bridge = new MaxBridge();

      bridge.ready().then(() => {
        // Получаем данные пользователя
        bridge.getUserInfo().then((userInfo) => {
          const container = document.getElementById('user-info');
          if (userInfo && userInfo.name) {
            container.textContent = `Имя: ${userInfo.name}`;
            container.className = ''; // убираем loading
          } else if (userInfo) {
            // Если имени нет, но объект есть — можно вывести ID
            container.textContent = 'Имя не указано. ID пользователя: ' + userInfo.id;
            container.className = '';
          } else {
            container.textContent = 'Не удалось получить данные пользователя.';
            container.className = 'error';
          }
        }).catch((err) => {
          console.error(err);
          document.getElementById('user-info').textContent = 'Ошибка получения данных.';
          document.getElementById('user-info').className = 'error';
        });
      }).catch((err) => {
        console.error('MAX Bridge не готов:', err);
        document.getElementById('user-info').textContent = 'MAX Bridge недоступен.';
        document.getElementById('user-info').className = 'error';
      });
    </script>
  </body>
</html>
