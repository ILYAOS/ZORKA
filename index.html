<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>MAX: данные пользователя</title>
    <!-- Скрипт обязательно должен быть здесь -->
    <script src="https://st.max.ru/js/max-web-app.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
        background-color: #f5f5f5;
      }
      .container {
        max-width: 400px;
        margin: 0 auto;
        background: #ffffff;
        padding: 24px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      }
      h2 { margin-top: 0; color: #333; }
      #user-info {
        padding: 12px;
        background: #eef2f7;
        border: 1px solid #d9e2ec;
        border-radius: 6px;
        color: #2c3e50;
        min-height: 24px;
        margin-top: 16px;
        white-space: pre-wrap;
      }
      button {
        padding: 12px 20px;
        font-size: 14px;
        cursor: pointer;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 6px;
      }
      button:hover { background-color: #0056b3; }
      button:disabled { background-color: #ccc; cursor: not-allowed; }
      .loading { color: #7f8c8d; }
      .error { color: #c0392b; }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Данные пользователя</h2>
      <button id="get-user-btn">О пользователе</button>
      <div id="user-info" class="loading">Ожидание контекста MAX…</div>
      <p style="margin-top:12px; font-size:12px; color:#888;">
        Важно: запускать нужно из интерфейса MAX, не в браузере напрямую.
      </p>
    </div>

    <script>
      const infoBox = document.getElementById('user-info');
      const btn = document.getElementById('get-user-btn');

      // Проверка: загружен ли MaxBridge
      if (typeof MaxBridge === 'undefined') {
        infoBox.textContent = 'Ошибка: MaxBridge не загружен. Приложение нужно запускать из MAX.';
        infoBox.className = 'error';
        btn.disabled = true;
        console.error('MaxBridge не определён. Проверьте, что страница открыта из MAX.');
      } else {
        const bridge = new MaxBridge();

        btn.addEventListener('click', () => {
          infoBox.textContent = 'Загрузка данных…';
          infoBox.className = 'loading';

          bridge.ready()
            .then(() => {
              console.log('MAX Bridge готов');
              return bridge.getUserInfo();
            })
            .then((userInfo) => {
              console.log('Данные пользователя:', userInfo);
              if (!userInfo) {
                infoBox.textContent = 'Данные пользователя не получены.';
                infoBox.className = 'error';
                return;
              }

              let text = '';
              text += userInfo.name ? `Имя: ${userInfo.name}\n` : 'Имя: не указано\n';
              text += userInfo.id ? `ID: ${userInfo.id}` : 'ID: не указан';

              infoBox.textContent = text;
              infoBox.className = '';
            })
            .catch((err) => {
              console.error('Ошибка получения данных:', err);
              infoBox.textContent = `Ошибка: ${err.message || String(err)}`;
              infoBox.className = 'error';
            });
        });
      }
    </script>
  </body>
</html>
