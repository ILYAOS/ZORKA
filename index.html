<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Зоренька — MAX MiniApp</title>
    <script src="https://st.max.ru/js/max-web-app.js"></script>
    <style>
      body { font-family: Arial, sans-serif; padding: 20px; }
      .buttons-container { display: flex; gap: 12px; flex-direction: column; }
      button {
        padding: 14px 20px;
        font-size: 16px;
        background-color: #ff9500; /* облепиховый цвет */
        color: white;
        border: none;
        cursor: pointer;
      }
      #user-info { margin-top: 20px; font-weight: bold; }
    </style>
  </head>
  <body>
    <h2>Зоренька</h2>
     <script src="https://st.max.ru/js/max-web-app.js"></script>
    <script src="https://st.max.ru/js/max-web-app.js"></script>
<script>
  if (window.WebApp) {
    window.WebApp.ready();

    // Проверяем, есть ли данные
    const initDataUnsafe = window.WebApp.initDataUnsafe;
    const user = initDataUnsafe?.user;
    const chatM=initDataUnsafe?.id;
    
    if (user) {
      const ggg = user.id;                 // ID пользователя
      const gggg = user.firstName;        // Имя (без подчёркивания)
      // hash не берём из user — он в initData и проверяется на сервере

      console.log(gggg, ggg, user.username || '—',user.language_code);

      // Выводим на форму вместо заголовков с текстом
      document.getElementById('out-gg').textContent = ggg;
      document.getElementById('out-gggg').textContent = gggg;
      // Можно вывести и username, если нужно
    } else {
      console.warn('Данные пользователя недоступны — возможно, приложение запущено не в MAX');
    }
  } else {
    console.error('WebApp не определён. Проверьте, что страница открыта в MAX и скрипт загружен.');
  }
</script>

<h2>ID пользователя:</h2>
<p id="out-gg"></p>

<h2>Имя пользователя:</h2>
<p id="out-gggg"></p>
    
    <div class="buttons-container">
      <button id="btn-menu">Меню</button>
      <button id="btn-phones">Наши номера</button>
      <button id="btn-sauna">Сауна</button>
      <button id="btn-events">Анонс мероприятий</button>
      <button id="btn-user">О пользователе</button>
    </div>

    <div id="user-info"></div>

    <script>
      if (window.WebApp) {
        window.WebApp.ready();
        // Опционально: развернуть на всю высоту
        // window.WebApp.expand();
      } else {
        document.body.textContent = 'Приложение должно быть запущено внутри MAX.';
        return;
      }

      function getUserData() {
        const initData = window.WebApp?.initData;
        if (!initData) return null;

        const params = new URLSearchParams(initData);
        const userStr = params.get('user');
        if (!userStr) return null;

        try {
          return JSON.parse(userStr);
        } catch (e) {
          console.error('Ошибка парсинга user', e);
          return null;
        }
      }

      // Кнопка «О пользователе»
      document.getElementById('btn-user').addEventListener('click', () => {
        const user = getUserData();
        const el = document.getElementById('user-info');
        if (user) {
          el.textContent = `ID: ${user.id}, Имя: ${user.first_name || 'Не указано'}`;
        } else {
          el.textContent = 'Данные пользователя недоступны';
        }
      });

      // Пример: открытие файла по кнопке (Яндекс Диск)
      const links = {
        'btn-menu': 'https://disk.yandex.ru/i/IYNKVFUQ-UUGPQ',
        'btn-phones': 'ССЫЛКА_НА_ФАЙЛ_НОМЕРА',
        'btn-sauna': 'ССЫЛКА_НА_ФАЙЛ_САУНА',
        'btn-events': 'ССЫЛКА_НА_events.csv'
      };

      Object.keys(links).forEach(id => {
        const btn = document.getElementById(id);
        if (btn) {
          btn.addEventListener('click', () => {
            const url = links[id];
            if (url) {
              window.WebApp.openLink(url); // откроет во внешнем браузере
            }
          });
        }
      });
    </script>
  </body>
</html>
