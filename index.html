<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Зоренька</title>
    <style>
      body { font-family: Arial, sans-serif; padding: 20px; }
      .buttons-container { display: flex; gap: 12px; flex-direction: column; }
      button {
        padding: 14px 20px;
        font-size: 16px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        background-color: #007bff;
        color: white;
      }
      button:hover { background-color: #0056b3; }
      #output { margin-top: 20px; min-height: 60px; }
      table { border-collapse: collapse; width: 100%; }
      th, td { border: 1px solid #ccc; padding: 6px 10px; text-align: left; }
      th { background-color: #f5f5f5; }
    </style>
  </head>
  <body>
    <h2>Меню бота</h2>
    <div class="buttons-container">
      <button onclick="handleAction('view_events')">Просмотр запланированных событий</button>
      <button onclick="handleAction('reports')">Отчёты</button>
      <button onclick="handleAction('capabilities')">Что умею</button>
    </div>
    <div id="output"></div>

    <script>
      // Прямая ссылка на CSV (должна быть ссылкой на скачивание, не на просмотр)
      const EVENTS_CSV_URL = 'https://disk.yandex.ru/d/ВАШ_ПАРАМЕТР/events123.csv';

      // Ссылка для кнопки «Что умею» (страница предпросмотра)
      const CAPABILITIES_LINK = 'https://disk.yandex.ru/i/IYNKVFUQ-UUGPQ';

      function handleAction(action) {
        const output = document.getElementById('output');
        output.innerHTML = '';

        if (action === 'view_events') {
          output.textContent = 'Загрузка событий…';
          fetchEvents();
        } else if (action === 'reports') {
          output.textContent = 'Формирую отчёты… (в разработке)';
        } else if (action === 'capabilities') {
          // Открываем ссылку в новой вкладке
          window.open(CAPABILITIES_LINK, '_blank');
          output.textContent = 'Открываю описание возможностей…';
        }
      }

      async function fetchEvents() {
        const output = document.getElementById('output');
        try {
          const response = await fetch(EVENTS_CSV_URL);
          if (!response.ok) throw new Error('Не удалось загрузить файл');
          const csvText = await response.text();
          const table = parseCSVToTable(csvText, ';');
          if (table) {
            output.appendChild(table);
          } else {
            output.textContent = 'Файл пуст или некорректен.';
          }
        } catch (err) {
          output.textContent = 'Ошибка: ' + err.message;
        }
      }

      function parseCSVToTable(csvText, delimiter) {
        const lines = csvText.split(/\r?\n/).filter(l => l.trim() !== '');
        if (lines.length === 0) return null;

        const table = document.createElement('table');
        const thead = document.createElement('thead');
        const tbody = document.createElement('tbody');

        const headers = lines[0].split(delimiter).map(h => h.trim());
        const headerRow = document.createElement('tr');
        headers.forEach(h => {
          const th = document.createElement('th');
          th.textContent = h;
          headerRow.appendChild(th);
        });
        thead.appendChild(headerRow);

        for (let i = 1; i < lines.length; i++) {
          const cells = lines[i].split(delimiter).map(c => c.trim());
          const row = document.createElement('tr');
          cells.forEach(c => {
            const td = document.createElement('td');
            td.textContent = c;
            row.appendChild(td);
          });
          tbody.appendChild(row);
        }

        table.appendChild(thead);
        table.appendChild(tbody);
        return table;
      }
    </script>
  </body>
</html>
